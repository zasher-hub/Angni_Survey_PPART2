<!DOCTYPE html>
<html>
    <head>
        <title>Mainpage</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <div class="container">

            <h1>Mainpage</h1>

            <input type="text" id="drink" placeholder="Drink"><br>

            <button type="button" onclick="clickButton(
                document.getElementById('drink').value
            )">Add Drink</button>

            <br><br>

            <ul id="drinkList"></ul>

            <a href="login.html">Logout</a>

        </div>

        <script>

        const clickButton = (a) => {

            const postData = {
                name:a,
            };

            const data = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(postData)
            };

            async function fetchData() {
                try {

                    const response = await fetch(
                        'http://127.0.0.1:8000/drinks',
                        data
                    );

                    const result = await response.json();

                    console.log(result);

                    if (response.ok && result.message && result.message.id) {
                        document.getElementById('drink').value = '';
                        showDrinks();
                    } else {
                        throw new Error('Failed to fetch data');
                    }

                } catch (error) {
                    console.error('Error:', error);
                }
            }

            fetchData();

        }

        const showDrinks = () => {

            async function fetchList() {
                try {

                    const response = await fetch('http://127.0.0.1:8000/drinks');

                    const result = await response.json();

                    console.log(result);

                    let text = '';
                    for (let i = 0; i < result.message.length; i++) {
                        text += '<li>' + result.message[i].name + '</li>';
                    }
                    document.getElementById('drinkList').innerHTML = text;

                } catch (error) {
                    console.error('Error:', error);
                }
            }

            fetchList();

        }

        showDrinks();

        </script>

    </body>
</html>
